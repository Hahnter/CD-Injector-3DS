name: release

# Builds the Windows app and, when started by hand with "publish" ticked on main (Actions > release > Run workflow),
# publishes it as a GitHub release. The version comes from cdinjector/__init__.py and the notes from its section of
# CHANGELOG.md. Without "publish" (the default), or from any other branch, it only builds, and keeps the app as a
# download on the run's page for a week: a way to try a change before it's released.
#
# The emulators and makerom inside the app are made by scripts/build_emulators.sh, which needs devkitPro. While they're
# unchanged, they're taken from the last release built with them (BASE_TAG): its zip and emulator source, each checked
# against the SHA-256 recorded below. When they change, build and publish that release the full way (README > Building
# from source), then point BASE_TAG and the two checksums at it. bannertool.exe is the author's own release build,
# checked against the SHA-256 recorded below (the same pins as in scripts/build_emulators.sh).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release (on main only); otherwise only build the app"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write                        # to create the release and its tag
    env:
      BASE_TAG: v1.1.0
      BASE_ZIP_SHA256: 9bc4a32aab74e911b2cdb8b50312914213a33cfe4d0856ff4c6def004918ef86
      BASE_SOURCE_SHA256: 7678fc4af2f1a642727ecfbce37b205a7aebdcaede648b2d09c318a621869a31
      BANNERTOOL_TAG: "1.2.0"
      BANNERTOOL_ZIP_SHA256: 69768596f836acb3e3aeaa66e47c6ba560dde813c6dfcd33c8afc25fe29b7524
      BANNERTOOL_EXE_SHA256: 62a20363f7cdebd7a9564beb52dc0ae80838ca35d9f35166d5a632a0844c93d4
      PUBLISH: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      # Actions are pinned to exact commits, not moving version tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt

      - name: The version, and (to publish) that it isn't released yet
        run: |
          $version = python -c "import cdinjector; print(cdinjector.VERSION)"
          if ($env:PUBLISH -eq "true") {
            gh release view "v$version" --repo $env:REPO 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { throw "v$version is already released: raise cdinjector.VERSION first." }
            $global:LASTEXITCODE = 0
          } elseif ("${{ inputs.publish }}" -eq "true") {
            Write-Output "::warning::publish was ticked, but a release is only published from main: building only."
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Emulators and tools from the last release built with them
        run: |
          $base = Join-Path $env:RUNNER_TEMP "base"          # outside the checkout, so the checks don't read it
          gh release download $env:BASE_TAG --repo $env:REPO --dir $base --pattern "*-windows.zip" --pattern "*-emulator-source.tar.gz"
          $zip = Get-Item "$base\*-windows.zip"
          $source = Get-Item "$base\*-emulator-source.tar.gz"
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:BASE_ZIP_SHA256) { throw "$($zip.Name) doesn't match its checksum" }
          if ((Get-FileHash $source -Algorithm SHA256).Hash -ne $env:BASE_SOURCE_SHA256) { throw "$($source.Name) doesn't match its checksum" }
          Expand-Archive $zip -DestinationPath "$base\app"
          New-Item -ItemType Directory -Force resources\tools, dist | Out-Null
          Copy-Item -Recurse "$base\app\CD-Injector-3DS\_internal\resources\cores" resources\cores
          Copy-Item -Recurse "$base\app\CD-Injector-3DS\_internal\resources\tools\windows" resources\tools\windows
          Copy-Item $source dist\emulator-source.tar.gz

      - name: bannertool.exe from its own release
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "bannertool"
          gh release download $env:BANNERTOOL_TAG --repo diasurgical/bannertool --dir $dir --pattern "bannertool.zip"
          if ((Get-FileHash "$dir\bannertool.zip" -Algorithm SHA256).Hash -ne $env:BANNERTOOL_ZIP_SHA256) { throw "bannertool.zip doesn't match its checksum" }
          Expand-Archive "$dir\bannertool.zip" -DestinationPath "$dir\files"
          $exe = "$dir\files\windows-x86_64\bannertool.exe"
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $env:BANNERTOOL_EXE_SHA256) { throw "bannertool.exe doesn't match its checksum" }
          Copy-Item $exe resources\tools\windows\bannertool.exe -Force

      - name: Build (the checks and tests run first)
        run: powershell -ExecutionPolicy Bypass -File scripts\build_windows.ps1

      - name: Keep the app as a download on this run's page
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: CD-Injector-3DS-${{ env.VERSION }}-${{ github.sha }}-windows
          path: dist/CD-Injector-3DS
          retention-days: 7
          if-no-files-found: error

      - name: Publish
        if: env.PUBLISH == 'true'
        run: |
          python scripts\release_notes.py dist\notes.md
          $base = "CD-Injector-3DS-v$env:VERSION"
          gh release create "v$env:VERSION" "dist\$base-windows.zip" "dist\$base-emulator-source.tar.gz" dist\SHA256SUMS.txt `
            --repo $env:REPO --target $env:GITHUB_SHA --title "CD Injector 3DS v$env:VERSION" --notes-file dist\notes.md
