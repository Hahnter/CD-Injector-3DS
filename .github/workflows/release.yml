name: release

# Builds the Windows app from main and publishes it as a GitHub release, when started by hand (Actions > release >
# Run workflow). The version comes from cdinjector/__init__.py and the notes from its section of CHANGELOG.md.
#
# The emulators, makerom and bannertool inside the app are made by scripts/build_emulators.sh, which needs devkitPro.
# While they're unchanged, they're taken from the last release built with them (BASE_TAG): its zip and emulator
# source, each checked against the SHA-256 recorded below. When they change, build and publish that release the full
# way (README > Building from source), then point BASE_TAG and the two checksums at it.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write                        # to create the release and its tag
    env:
      BASE_TAG: v1.1.0
      BASE_ZIP_SHA256: 9bc4a32aab74e911b2cdb8b50312914213a33cfe4d0856ff4c6def004918ef86
      BASE_SOURCE_SHA256: 7678fc4af2f1a642727ecfbce37b205a7aebdcaede648b2d09c318a621869a31
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      # Actions are pinned to exact commits, not moving version tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt

      - name: This version isn't released yet
        run: |
          $version = python -c "import cdinjector; print(cdinjector.VERSION)"
          gh release view "v$version" --repo $env:REPO 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "v$version is already released: raise cdinjector.VERSION first." }
          $global:LASTEXITCODE = 0
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Emulators and tools from the last release built with them
        run: |
          $base = Join-Path $env:RUNNER_TEMP "base"          # outside the checkout, so the checks don't read it
          gh release download $env:BASE_TAG --repo $env:REPO --dir $base --pattern "*-windows.zip" --pattern "*-emulator-source.tar.gz"
          $zip = Get-Item "$base\*-windows.zip"
          $source = Get-Item "$base\*-emulator-source.tar.gz"
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:BASE_ZIP_SHA256) { throw "$($zip.Name) doesn't match its checksum" }
          if ((Get-FileHash $source -Algorithm SHA256).Hash -ne $env:BASE_SOURCE_SHA256) { throw "$($source.Name) doesn't match its checksum" }
          Expand-Archive $zip -DestinationPath "$base\app"
          New-Item -ItemType Directory -Force resources\tools, dist | Out-Null
          Copy-Item -Recurse "$base\app\CD-Injector-3DS\_internal\resources\cores" resources\cores
          Copy-Item -Recurse "$base\app\CD-Injector-3DS\_internal\resources\tools\windows" resources\tools\windows
          Copy-Item $source dist\emulator-source.tar.gz

      - name: Build (the checks and tests run first)
        run: powershell -ExecutionPolicy Bypass -File scripts\build_windows.ps1

      - name: Publish
        run: |
          python scripts\release_notes.py dist\notes.md
          $base = "CD-Injector-3DS-v$env:VERSION"
          gh release create "v$env:VERSION" "dist\$base-windows.zip" "dist\$base-emulator-source.tar.gz" dist\SHA256SUMS.txt `
            --repo $env:REPO --target $env:GITHUB_SHA --title "CD Injector 3DS v$env:VERSION" --notes-file dist\notes.md
